# Konfiguracja Jekylla dla knhmi.pl
# Wydarzenia są w folderze _wydarzenia (edytowane przez Pages CMS).
# output: false – wydarzenia nie dostają osobnych podstron, pokazują się tylko na Wydarzenia.html
collections:
  wydarzenia:
    output: false

# Pliki pomocnicze, które nie mają trafić na stronę
exclude:
  - scripts
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
