media:
  input: Zdjęcia_wydarzenia
  output: /Zdjęcia_wydarzenia
content:
  - name: wydarzenia
    label: Wydarzenia
    type: collection
    path: _wydarzenia
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date]
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - { name: title, label: Tytuł (PL), type: string, required: true }
      - { name: title_en, label: "Tytuł (EN) – zostaw puste, przetłumaczy się samo", type: string }
      - { name: date, label: Data, type: date, required: true }
      - { name: date_end, label: Data zakończenia (tylko dla wydarzeń kilkudniowych), type: date }
      - { name: image, label: Zdjęcie, type: image }
      - { name: text, label: Opis (PL), type: text }
      - { name: text_en, label: "Opis (EN) – zostaw puste, przetłumaczy się samo", type: text }
      - { name: link, label: Link do posta lub wideo, type: string }
      - name: link_label
        label: Rodzaj przycisku
        type: select
        default: WIĘCEJ
        options:
          values: [WIĘCEJ, WIDEO]
